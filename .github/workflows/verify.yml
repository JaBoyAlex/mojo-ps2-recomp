name: Verify redistributable project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/check_manifest.py
      - run: ./scripts/package.ps1
      - run: ./scripts/security.ps1 -Archive dist/MOJO-Recomp-v1.0.0-rc.6-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-portable-builder
          path: |
            dist/MOJO-Recomp-v1.0.0-rc.6-Windows-x64.zip
            dist/MOJO-Recomp-v1.0.0-rc.6-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-portable-builder
          path: release
      - name: Publish verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -ne 'v1.0.0-rc.6') { throw 'Update the version and release notes before tagging.' }
          gh release create $env:RELEASE_TAG release/MOJO-Recomp-v1.0.0-rc.6-Windows-x64.zip release/MOJO-Recomp-v1.0.0-rc.6-Windows-x64.zip.sha256 --verify-tag --prerelease --title 'MOJO! Recomp v1.0.0-rc.6' --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
