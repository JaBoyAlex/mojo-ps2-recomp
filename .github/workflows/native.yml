name: Native platform validation
on:
  push:
    branches: [codex/native-platforms]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libc++-19-dev libc++abi-19-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libasound2-dev libpulse-dev libudev-dev libvulkan1 mesa-vulkan-drivers
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_manifest.py
      - run: python scripts/native_ci.py
      - run: python scripts/package_native.py
      - run: python scripts/verify_publication.py --git
      - run: python scripts/security_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-helpers-${{ matrix.runner }}
          path: |
            dist/*native-preview*.zip
            dist/*native-preview*.tar.gz
            dist/*native-preview*.sha256
          if-no-files-found: error
          retention-days: 7
